name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting, vet and tests
        run: make check
      - name: Race detector
        if: runner.os == 'Linux'
        run: make test-race
      - name: Modules are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build
        run: make build
      # Ownership and permission alignment changes owners for real, and
      # running providers as the invoking user starts processes as another
      # account, both of which need root. The test binaries are built as the
      # runner user and only run with sudo, so nothing root-owned lands in the
      # Go caches.
      - name: Root-only tests
        if: runner.os == 'Linux'
        run: |
          go test -c -o "$RUNNER_TEMP/align.test" ./internal/align
          go test -c -o "$RUNNER_TEMP/privdrop.test" ./internal/privdrop
          go test -c -o "$RUNNER_TEMP/cli.test" ./internal/cli
          (cd internal/align && sudo STARPOINT_ROOT_TESTS=1 "$RUNNER_TEMP/align.test" -test.run AsRoot -test.v)
          (cd internal/privdrop && sudo STARPOINT_ROOT_TESTS=1 "$RUNNER_TEMP/privdrop.test" -test.run AsRoot -test.v)
          (cd internal/cli && sudo STARPOINT_ROOT_TESTS=1 "$RUNNER_TEMP/cli.test" -test.run AsRoot -test.v)

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/starpoint
