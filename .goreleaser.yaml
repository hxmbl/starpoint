version: 2

project_name: starpoint

builds:
  # The executable is str (STRM-445). The archives and the formula keep the
  # project's name, starpoint; the formula also links the old command name.
  - main: ./cmd/str
    binary: str
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/hxmbl/starpoint/internal/cli.Version={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: ["tar.gz"]
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: starpoint
    repository:
      owner: Hxmbl
      name: homebrew-tap
    commit_author:
      name: hxmbl
      email: hxmbl@users.noreply.github.com
    homepage: https://github.com/hxmbl/starpoint
    description: Declarative orchestration over the package managers on your machine.
    license: MIT
    test: |
      system "#{bin}/str", "--version"
      system "#{bin}/starpoint", "--version"
    install: |
      bin.install "str"
      bin.install_symlink "str" => "starpoint"
      bash_completion.install "completions/str.bash" => "str"
      bash_completion.install_symlink bash_completion/"str" => "starpoint"
      zsh_completion.install "completions/str.zsh" => "_str"
      fish_completion.install "completions/str.fish"
      fish_completion.install "completions/starpoint.fish"
    skip_upload: true
